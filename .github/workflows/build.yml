name: Testy i budowanie

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Klucz podpisu (z sekretów, jeśli są ustawione)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 - APK podpisany kluczem testowym (aktualizacje nie zainstalują się na starą wersję)."
          fi
      - run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        with:
          name: hasla-apka-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          } else { $iscc = "iscc" }
          if (-not (Get-Command $iscc -ErrorAction SilentlyContinue)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" windows\installer\hasla-apka.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: hasla-apka-windows-instalator
          path: build/installer/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hasla-apka-windows
          path: build/windows/x64/runner/Release/

  # Po każdej zmianie na main z nowym numerem wersji (pubspec.yaml) publikuje wydanie na GitHubie.
  # Aplikacja sprawdza najnowsze wydanie i sama proponuje aktualizację.
  release:
    name: Wydanie
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Opublikuj wydanie
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Wydanie $tag już istnieje. Podnieś wersję w pubspec.yaml, żeby opublikować nowe."
            exit 0
          fi
          files=(dist/hasla-apka-windows-instalator/*.exe)
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            cp dist/hasla-apka-android/app-release.apk "dist/HaslaApka-$version.apk"
            files+=("dist/HaslaApka-$version.apk")
          else
            echo "::warning::Brak stałego klucza podpisu (sekret ANDROID_KEYSTORE_BASE64), więc wydanie nie zawiera APK. Telefon nie przyjąłby go jako aktualizacji."
          fi
          gh release create "$tag" "${files[@]}" --title "Hasła apka $version" --generate-notes --target "$GITHUB_SHA"
